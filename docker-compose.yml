version: '3.8'

services:
  # 1. Secure Private Vector Store (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pln_qdrant_vector_store
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # 2. FastAPI Dense Vector Embedding & Reranker Microservice
  ai-embedding-service:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: pln_ai_embedding_reranker
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - EMBED_MODEL_NAME=BAAI/bge-small-en-v1.5
      - RERANK_MODEL_NAME=BAAI/bge-reranker-base
    restart: unless-stopped
    depends_on:
      - qdrant

  # 3. Renewables AI Web Application (Express + LangChain Orchestrator)
  renewables-ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pln_renewables_ai_app
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=pln_renewables_kb
      - FASTAPI_EMBEDDING_URL=http://ai-embedding-service:8001/embeddings
      - RERANKER_API_URL=http://ai-embedding-service:8001/rerank
      - DAILY_TOKEN_LIMIT=500000
      - MONTHLY_TOKEN_LIMIT=5000000
    volumes:
      - ./database.sqlite:/app/database.sqlite
    restart: unless-stopped
    depends_on:
      - qdrant
      - ai-embedding-service

volumes:
  qdrant_data:
